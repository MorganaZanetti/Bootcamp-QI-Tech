services:
  db:
    build: ./database
    environment:
      POSTGRES_DB: qi_bank
      POSTGRES_USER: qi
      POSTGRES_PASSWORD: qi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qi -d qi_bank"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock:
    build: ./mock_server
    ports:
      - "9000:9000"

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://qi:qi@db:5432/qi_bank
      JWT_SECRET: development-secret-key-with-at-least-32-bytes
      MOCK_BASE_URL: http://mock:9000
      MANAGER_KEY: manager123
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mock:
        condition: service_started

volumes:
  postgres_data:
